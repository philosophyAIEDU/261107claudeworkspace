# 설치 파일 자동 만들기
# v로 시작하는 태그(예: v0.1.0)를 올리면 Windows(.exe)·macOS(.dmg) 설치 파일을 만들어
# GitHub Releases에 올린다. Netlify 소개 페이지의 다운로드 버튼은 이 파일들을 가리킨다.
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 코드 서명 인증서가 아직 없으므로 macOS 자동 서명 찾기를 끈다
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
