# 설치 파일 자동 만들기
# v로 시작하는 태그(예: v0.1.0)를 올리면 Windows(.exe)·macOS(.dmg) 설치 파일을 만들어
# GitHub Releases에 올린다. Netlify 소개 페이지의 다운로드 버튼은 이 파일들을 가리킨다.
#   git tag v0.1.0 && git push origin v0.1.0
# (수동 실행(workflow_dispatch)은 설치 파일만 만들어 Actions 결과물로 남기고 릴리스는 만들지 않는다)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/*.exe
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # 코드 서명 인증서가 아직 없으므로 macOS 자동 서명 찾기를 끈다
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 두 운영체제의 빌드가 모두 끝난 뒤 릴리스를 한 번에 만든다(동시에 만들다 충돌하지 않게).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: GitHub 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## 내려받기
          - **Windows 10/11**: `PhilosophyClaudeWorkroom-Setup.exe`
          - **macOS (애플 실리콘 M1~M4)**: `PhilosophyClaudeWorkroom-mac-arm64.dmg`
          - **macOS (인텔)**: `PhilosophyClaudeWorkroom-mac-x64.dmg`

          아직 코드 서명이 없어서 처음 실행할 때 경고가 떠요. README의 "서명 없는 앱 실행 경고 넘기기"를 참고하세요.
          Claude Code가 없다면 앱 첫 화면의 [🪄 자동으로 설치하기]를 누르면 돼요.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "필로소피 Claude 작업실 $TAG" --notes-file notes.md
