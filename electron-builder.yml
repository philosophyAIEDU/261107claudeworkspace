# 설치 파일 만들기 설정 (npm run dist:win / npm run dist:mac)
appId: kr.philosophyai.claude-workroom
productName: 필로소피 Claude 작업실
copyright: Copyright © 2026 Philosophy AI Education

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # Agent SDK에 딸린 Claude Code 실행 파일(수백 MB)은 쓰지 않으므로 넣지 않는다.
  # (이 앱은 사용자가 설치한 claude를 실행하고, SDK는 세션 기록 조회에만 쓴다)
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!node_modules/node-pty/{src,scripts,deps,third_party,typings}/**"
  - "!node_modules/node-pty/build/{Debug,deps,obj.target,Release/obj.target}/**"
  - "!**/*.{pdb,map,md,ts}"
  - "!**/{test,tests,__tests__,example,examples}/**"

# 보안 퓨즈(Electron Fuses): 실행 파일 안에 새겨 두는 보안 스위치.
# 설치된 앱을 다른 프로그램이 "Node.js 실행기"나 디버깅 통로로 악용하지 못하게 막는다.
# (악성코드가 서명된 Electron 앱을 빌려 쓰는 수법을 막아, 백신이 의심하는 동작도 줄인다)
electronFuses:
  runAsNode: false                          # ELECTRON_RUN_AS_NODE로 앱을 Node 실행기처럼 쓰는 것 차단
  enableNodeOptionsEnvironmentVariable: false   # NODE_OPTIONS로 코드 주입 차단
  enableNodeCliInspectArguments: false      # --inspect 디버거 연결 차단
  enableCookieEncryption: true              # 저장되는 쿠키 암호화
  enableEmbeddedAsarIntegrityValidation: true   # 앱 파일(app.asar)이 바뀌면 실행 거부 (Windows·macOS)
  onlyLoadAppFromAsar: true                 # app.asar 밖의 코드로 바꿔치기 차단

# node-pty는 네이티브 모듈이라 asar 압축 파일 밖으로 풀어 둬야 불러올 수 있다.
asarUnpack:
  - node_modules/node-pty/**

# node-pty 1.x는 Node-API로 빌드된 미리 만든 파일(prebuilds)을 Windows·macOS용으로 포함하고 있어
# Electron 버전에 맞춰 다시 빌드할 필요가 없다.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  # 버전 번호를 파일 이름에 넣지 않아야 소개 페이지의 "최신 버전 받기" 링크가 항상 같은 주소를 쓸 수 있다.
  artifactName: "PhilosophyClaudeWorkroom-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 필로소피 Claude 작업실
  installerLanguages: [ko_KR]
  language: "1042"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.education
  artifactName: "PhilosophyClaudeWorkroom-mac-${arch}.${ext}"
  # 공증(notarization)에 필요한 강화된 런타임. 권한(entitlements)은 electron-builder 기본값을 쓴다
  # (Electron의 JIT 등에 필요한 최소 권한).
  # 인증서(CSC_LINK)가 없으면 서명 없이 빌드되고, 있으면 자동으로 서명·공증한다(.github/workflows/release.yml 참고).
  hardenedRuntime: true

dmg:
  title: 필로소피 Claude 작업실

linux:
  target: [AppImage]
  category: Education
  artifactName: "PhilosophyClaudeWorkroom-linux.${ext}"
